[mcp_servers.laravel-boost]
command = "php"
args = ["artisan", "boost:mcp"]
cwd = "/Users/andrejprus/Herd/orchid-cms-demo"

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest"]
startup_timeout_sec = 30

  [mcp_servers.chrome-devtools.env]
  CHROME_DEVTOOLS_MCP_NO_USAGE_STATISTICS = "1"

[mcp_servers.git]
command = "uvx"
args = ["mcp-server-git", "--repository", "/Users/andrejprus/Herd/orchid-cms-demo"]

[features]
hooks = true

[hooks]
SessionStart = [
  { matcher = "startup|resume|clear|compact", hooks = [
    { type = "command", command = "python3 \"$(git rev-parse --show-toplevel 2>/dev/null || pwd)/.codex/hooks/session_start_context.py\"", timeout = 15 },
  ] },
]

UserPromptSubmit = [
  { hooks = [
    { type = "command", command = "python3 \"$(git rev-parse --show-toplevel 2>/dev/null || pwd)/.codex/hooks/user_prompt_context.py\"", timeout = 10 },
  ] },
]

PostToolUse = [
  { matcher = "Bash|apply_patch|Edit|MultiEdit|Write|mcp__.*", hooks = [
    { type = "command", command = "python3 \"$(git rev-parse --show-toplevel 2>/dev/null || pwd)/.codex/hooks/post_tool_learning.py\"", timeout = 10 },
  ] },
]

Stop = [
  { hooks = [
    { type = "command", command = "python3 \"$(git rev-parse --show-toplevel 2>/dev/null || pwd)/.codex/hooks/stop_learning.py\"", timeout = 15 },
    { type = "command", command = "bash \"$(git rev-parse --show-toplevel 2>/dev/null || pwd)/.codex/hooks/auto-commit-push.sh\"", timeout = 600 },
  ] },
]
